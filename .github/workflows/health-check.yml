# Daily HEAD on every mod download URL. Output public/data/health.json with
# any 4xx/5xx URLs flagged. The /status/ page surfaces the count.

name: Mod download health check

on:
  schedule:
    - cron: "30 4 * * *"  # 04:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write            # so a data commit can start the Pages deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Probe download URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/health-check.mjs
      - name: Commit health.json if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/health.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh download health-check results"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the workflow's own token does not start other workflows,
      # so the Pages deploy is started here.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
